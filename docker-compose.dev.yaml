version: "3.8"

services:
  jarvis-logs:
    build: .
    container_name: jarvis-logs
    ports:
      - "${LOG_SERVER_PORT:-7702}:${LOG_SERVER_PORT:-7702}"
    environment:
      - LOKI_URL=http://loki:7032
      - LOG_SERVER_PORT=${LOG_SERVER_PORT:-7702}
      - JARVIS_AUTH_BASE_URL=${JARVIS_AUTH_BASE_URL:-http://host.docker.internal:7701}
      - JARVIS_APP_ID=${JARVIS_APP_ID:-jarvis-logs}
      - JARVIS_APP_KEY=${JARVIS_APP_KEY}
      - JARVIS_CONFIG_URL=${JARVIS_CONFIG_URL:-http://host.docker.internal:7700}
      # This service sits on jarvis-logs-network, not the shared jarvis-net, so
      # it cannot resolve the container coords (auth-api:8000) that the default
      # style returns. 'external' asks for the published pair instead, and
      # jarvis-config-client sends this container's own config-url hostname as
      # remote_host, so "localhost" comes back rewritten to host.docker.internal.
      # Without this passthrough the var is stripped by the environment
      # allowlist and node log ingestion 403s on "Auth service unavailable".
      - JARVIS_CONFIG_URL_STYLE=${JARVIS_CONFIG_URL_STYLE:-external}
    extra_hosts:
      - "${DOCKER_HOST_ALIAS:-host.docker.internal}:host-gateway"
    volumes:
      - ./app:/app/app
      - ../jarvis-config-client:/app/jarvis-config-client
      - ../jarvis-settings-client:/app/jarvis-settings-client
    depends_on:
      - loki
    networks:
      - jarvis-logs-network
    command: >
      sh -c "pip install -q -e /app/jarvis-config-client -e /app/jarvis-settings-client &&
             uvicorn app.main:app --reload --host 0.0.0.0 --port ${LOG_SERVER_PORT:-7702}"

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "7032:7032"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - jarvis-logs-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "7033:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=jarvis
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - jarvis-logs-network

  postgres:
    profiles: ["standalone"]
    image: postgres:15
    environment:
      POSTGRES_DB: jarvis_logs
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - logs-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jarvis-logs-network

networks:
  jarvis-logs-network:
    driver: bridge

volumes:
  loki-data:
  grafana-data:
  logs-pg-data:
