[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-logs"
version = "0.1.0"
description = "Centralized logging service for the Jarvis ecosystem"
requires-python = ">=3.11"
dependencies = [
    "jarvis-config-client @ git+https://github.com/alexberardi/jarvis-config-client.git@c1c8903",
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "python-dotenv",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "psycopg2-binary>=2.9.9",
    "jarvis-auth-client @ git+https://github.com/alexberardi/jarvis-auth-client.git@4549b23",
    "jarvis-settings-client @ git+https://github.com/alexberardi/jarvis-settings-client.git@402674d",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx[http2]",
]

[tool.setuptools.packages.find]
include = ["app*"]
