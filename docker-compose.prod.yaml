version: "3.8"

services:
  jarvis-logs:
    build: .
    container_name: jarvis-logs
    ports:
      - "${LOG_SERVER_PORT:-7702}:${LOG_SERVER_PORT:-7702}"
    environment:
      - LOKI_URL=http://loki:7032
      - LOG_SERVER_PORT=${LOG_SERVER_PORT:-7702}
      - JARVIS_AUTH_BASE_URL=${JARVIS_AUTH_BASE_URL:-http://host.docker.internal:7701}
      - JARVIS_APP_ID=${JARVIS_APP_ID:-jarvis-logs}
      - JARVIS_APP_KEY=${JARVIS_APP_KEY}
    extra_hosts:
      - "${DOCKER_HOST_ALIAS:-host.docker.internal}:host-gateway"
    depends_on:
      - loki
    networks:
      - jarvis-logs-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "7032:7032"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - jarvis-logs-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "7033:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=jarvis
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - jarvis-logs-network
    restart: unless-stopped

networks:
  jarvis-logs-network:
    driver: bridge

volumes:
  loki-data:
  grafana-data:
